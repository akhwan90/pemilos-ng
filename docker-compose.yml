services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: pemilos-ng:alpine
    container_name: pemilos_ng_app
    restart: unless-stopped
    networks:
      - pemilos_app-network
    ports:
      - "${APP_PORT:-8000}:80"
    env_file:
      - .env
    environment:
      # Koneksi Database
      # DB_HOST disetel dengan IP host docker bawaan (host.docker.internal / 172.17.0.1)
      # atau bisa disesuaikan jika pemilos-db punya network bridge khusus.
      DB_HOST: ${DB_HOST:-172.17.0.1}
      DB_PORT: ${DB_PORT:-3307}
      DB_DATABASE: ${DB_DATABASE:-pemilos}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-root}

      # Menulis log ke console (docker logs) dan ke dalam storage/logs/ (bisa diatur dari LOG_STACK di .env)
      LOG_CHANNEL: stack

    # Supaya container ini bisa mengakses jaringan/DB localhost dari OS Induk (tempat pemilos-db berjalan)
    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      # Mount folder storage agar file upload (foto) dan Logs persisten
      - ./storage/app/public:/var/www/html/storage/app/public
      - ./storage/logs:/var/www/html/storage/logs
networks:
  pemilos_app-network: 
    driver: bridge
# Tidak perlu service mariadb disini karena memakai pemilos-db yang ada di luar project ini
